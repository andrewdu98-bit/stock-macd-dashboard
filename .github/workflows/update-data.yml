name: Update market data
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC only. These two UTC times cover both EST and EDT.
    # The first step below keeps only the run that is actually 10:00 AM in Detroit.
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless it's 10 AM in Detroit
        if: github.event_name == 'schedule'
        env:
          TZ: America/Detroit
        run: |
          hour=$(date +%H)
          if [ "$hour" != "10" ]; then
            echo "Not 10 AM in Detroit yet (current hour: $hour); skipping."
            exit 0
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-data.js
      - name: Commit updated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
